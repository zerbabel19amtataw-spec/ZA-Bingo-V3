name: Deploy Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  deploy_functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Functions
        uses: w9jds/firebase-action@v13
        with:
          args: deploy --only functions --project za-bingo-7ad31
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZA_BINGO_7AD31 }}
